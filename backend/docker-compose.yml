version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: piemr_db
      POSTGRES_USER: piemr
      POSTGRES_PASSWORD: piemr_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piemr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    working_dir: /app
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://piemr:piemr_pass@db:5432/piemr_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    working_dir: /app
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://piemr:piemr_pass@db:5432/piemr_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A config worker --loglevel=info --concurrency=2

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    working_dir: /app
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://piemr:piemr_pass@db:5432/piemr_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
