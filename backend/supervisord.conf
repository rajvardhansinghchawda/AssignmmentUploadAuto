[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gunicorn]
command=gunicorn config.wsgi:application --bind 0.0.0.0:7860 --workers 2 --timeout 120
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

[program:celery_worker]
command=celery -A config worker --loglevel=info --concurrency=5 -P prefork
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2

[program:celery_beat]
command=/bin/sh -c 'if [ "${ENABLE_CELERY_BEAT:-1}" = "1" ]; then exec celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler; else echo "Celery Beat disabled via ENABLE_CELERY_BEAT=0"; exec tail -f /dev/null; fi'
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=3
